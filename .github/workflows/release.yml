name: Publish APK release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download and verify APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK="ProChat-${VERSION}.apk"
          BASE="https://ai.h80b5c8fe.nyat.app:21398/prochat"
          SUM_FILE=".github/checksums/${GITHUB_REF_NAME}.sha256"
          NOTES_FILE=".github/release-notes-${VERSION}.md"

          curl -fsSL --retry 3 --retry-delay 3 -o "$APK" "$BASE/$APK"
          test -f "$SUM_FILE"
          test -f "$NOTES_FILE"
          sha256sum -c "$SUM_FILE"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK="ProChat-${VERSION}.apk"
          NOTES_FILE=".github/release-notes-${VERSION}.md"

          gh release create "${GITHUB_REF_NAME}" "$APK" \
            --title "ProChat ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --latest
