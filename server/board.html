<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="robots" content="noindex,nofollow">
<title>ProChat 留言板</title>
<style>
:root {
  --bg:#0b0e14; --card:#11161f; --line:rgba(255,255,255,.1);
  --fg:#e9eef7; --dim:#8b97ab; --faint:#5c6779; --accent:#4c8dff;
  --ok:#3ddc97; --warn:#ffb454;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
header {
  position:sticky; top:0; z-index:2; background:rgba(11,14,20,.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); padding:18px 20px;
}
.wrap { max-width:760px; margin:0 auto; padding:18px 16px 60px; }
h1 { margin:0; font-size:20px; }
.sub { color:var(--dim); font-size:12.5px; margin-top:3px; }
.top { display:flex; align-items:center; gap:14px; }
.top .grow { flex:1; }
a { color:var(--accent); text-decoration:none; }
.dl {
  display:inline-block; background:var(--accent); color:#fff; border-radius:9px;
  padding:8px 13px; font-size:12.5px; white-space:nowrap;
}
.notice {
  background:rgba(76,141,255,.08); border:1px solid rgba(76,141,255,.25);
  border-radius:12px; padding:11px 14px; color:var(--dim); font-size:12.5px;
  margin:14px 0 18px;
}
.notice b { color:var(--fg); }
.item {
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:15px 16px; margin-bottom:12px;
}
.head { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:7px; }
.head b { font-size:14px; }
.head time { color:var(--faint); font-size:11.5px; }
.badge { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
.badge.open { color:var(--warn); border-color:rgba(255,180,84,.35); background:rgba(255,180,84,.08); }
.badge.resolved { color:var(--ok); border-color:rgba(61,220,151,.35); background:rgba(61,220,151,.08); }
.content { white-space:pre-wrap; word-break:break-word; }
.reply {
  margin-top:10px; padding:9px 11px; border-left:3px solid var(--accent);
  background:rgba(76,141,255,.07); border-radius:0 9px 9px 0;
  color:var(--dim); font-size:13px; white-space:pre-wrap; word-break:break-word;
}
.reply b { color:var(--accent); font-size:11.5px; display:block; margin-bottom:2px; }
.empty { color:var(--dim); text-align:center; padding:48px 10px; }
.msg { color:var(--dim); font-size:12px; text-align:center; padding:10px; }
.msg.err { color:#ff6b6b; }
@media (max-width:560px) {
  header { padding:14px; }
  .wrap { padding:14px 12px 48px; }
  .top { gap:9px; }
  h1 { font-size:18px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <div class="top">
      <div>
        <h1>ProChat 留言板</h1>
        <div class="sub" id="sub">Bug 反馈与使用问题</div>
      </div>
      <span class="grow"></span>
      <a class="dl" id="download" href="#" style="display:none">下载最新版</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="notice">
    <b>留言会公开显示。</b>请不要填写 API Key、密码、聊天隐私或其它敏感信息。
    管理员回复和「已解决」状态会显示在留言下方。
  </div>
  <div id="list"><div class="msg">加载中…</div></div>
</div>

<script>
(function () {
  'use strict';
  const here = location.pathname.replace(/\/+$/, '');
  const BASE = here.endsWith('/board') ? here.slice(0, -6) : (here === '/' ? '' : here);
  const list = document.getElementById('list');
  const sub = document.getElementById('sub');

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function fmt(ts) {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    const p = (n) => String(n).padStart(2, '0');
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function render(items) {
    list.replaceChildren();
    if (!items.length) {
      list.appendChild(el('div', 'empty', '还没有留言，来写第一条吧。'));
      return;
    }
    items.forEach(it => {
      const card = el('div', 'item');
      const head = el('div', 'head');
      head.appendChild(el('b', null, it.name || '匿名用户'));
      head.appendChild(el('span', 'badge ' + (it.status === 'resolved' ? 'resolved' : 'open'),
        it.status === 'resolved' ? '已解决' : '待处理'));
      head.appendChild(el('time', null, fmt(it.createdAt)));
      card.appendChild(head);
      card.appendChild(el('div', 'content', it.content));
      if (it.reply) {
        const r = el('div', 'reply');
        r.appendChild(el('b', null, '开发者回复'));
        r.appendChild(document.createTextNode(it.reply));
        card.appendChild(r);
      }
      list.appendChild(card);
    });
  }

  async function load() {
    try {
      const r = await fetch(BASE + '/api/feedback?limit=50', { cache: 'no-store' });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
      render(data.items || []);
      sub.textContent = '共 ' + (data.total || 0) + ' 条留言';
    } catch (e) {
      list.replaceChildren(el('div', 'msg err', '加载失败：' + e.message));
    }
  }

  async function loadUpdate() {
    try {
      const r = await fetch(BASE + '/update.json', { cache: 'no-store' });
      if (!r.ok) return;
      const u = await r.json();
      if (!u || !u.url) return;
      const a = document.getElementById('download');
      a.href = /^https?:\/\//i.test(u.url) ? u.url : new URL(u.url, location.href).toString();
      a.textContent = '下载 ' + (u.versionName || '最新版');
      a.style.display = '';
      sub.textContent = '最新版本 ' + (u.versionName || '');
    } catch (e) {}
  }

  load();
  loadUpdate();
})();
</script>
</body>
</html>
