<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="robots" content="noindex,nofollow">
<title>ProChat 留言管理</title>
<style>
:root {
  --bg:#0b0e14; --card:#11161f; --card2:#18202c; --line:rgba(255,255,255,.1);
  --fg:#e9eef7; --dim:#8b97ab; --faint:#5c6779; --accent:#4c8dff;
  --ok:#3ddc97; --warn:#ffb454; --danger:#ff6b6b;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
header {
  position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:14px;
  padding:14px 20px; background:rgba(11,14,20,.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
header h1 { margin:0; font-size:17px; letter-spacing:.2px; }
header .grow { flex:1; }
header .sub { color:var(--dim); font-size:12px; }
a { color:var(--accent); text-decoration:none; }
main { max-width:980px; margin:0 auto; padding:20px; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px;
  margin-bottom:16px;
}
.card h2 { margin:0 0 12px; font-size:15px; }
label.field { display:block; margin:10px 0; }
label.field > span { display:block; color:var(--dim); font-size:12px; margin-bottom:5px; }
input, select, textarea {
  width:100%; background:var(--card2); color:var(--fg); border:1px solid var(--line);
  border-radius:9px; padding:9px 11px; font:inherit; outline:none;
}
input:focus, select:focus, textarea:focus { border-color:var(--accent); }
textarea { resize:vertical; min-height:72px; line-height:1.55; }
button {
  background:var(--card2); color:var(--fg); border:1px solid var(--line);
  border-radius:9px; padding:8px 13px; font:inherit; cursor:pointer;
}
button:hover { border-color:var(--accent); color:var(--accent); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.primary:hover { filter:brightness(1.08); color:#fff; }
button.danger:hover { border-color:var(--danger); color:var(--danger); }
button:disabled { opacity:.5; cursor:default; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.toolbar {
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  margin-bottom:14px;
}
.toolbar .grow { flex:1; }
.toolbar select { width:auto; min-width:120px; }
.msg { color:var(--dim); font-size:12px; min-height:18px; }
.msg.err { color:var(--danger); }
.msg.ok { color:var(--ok); }
.hidden { display:none !important; }
.item {
  background:var(--card); border:1px solid var(--line); border-radius:13px;
  padding:15px 16px; margin-bottom:12px;
}
.item.hidden-item { opacity:.68; }
.item-head { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:7px; }
.item-head b { font-size:14px; }
.item-head time { color:var(--faint); font-size:11.5px; }
.badge {
  font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line);
  color:var(--dim);
}
.badge.open { color:var(--warn); border-color:rgba(255,180,84,.35); background:rgba(255,180,84,.08); }
.badge.resolved { color:var(--ok); border-color:rgba(61,220,151,.35); background:rgba(61,220,151,.08); }
.badge.hidden { color:var(--faint); }
.content { white-space:pre-wrap; word-break:break-word; margin:8px 0 10px; }
.meta { color:var(--dim); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; margin:7px 0; }
.meta code { color:var(--faint); font-size:11px; }
.replybox { margin-top:9px; }
.replybox textarea { min-height:54px; font-size:12.5px; }
.actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; }
.login { max-width:460px; margin:12vh auto 0; }
.login h1 { font-size:20px; text-align:center; }
.login p { color:var(--dim); font-size:12.5px; text-align:center; }
.login .row { justify-content:center; margin-top:12px; }
.login input { text-align:center; }
.empty { color:var(--dim); text-align:center; padding:40px 10px; }
.update-grid { display:grid; grid-template-columns:110px 1fr; gap:10px 12px; align-items:start; }
.update-grid textarea { grid-column:1 / -1; }
@media (max-width:560px) {
  main { padding:12px; }
  header { padding:12px 14px; }
  .update-grid { grid-template-columns:1fr; }
  .update-grid textarea { grid-column:auto; }
}
</style>
</head>
<body>

<div id="login" class="login card hidden">
  <h1>ProChat 留言管理</h1>
  <p>输入管理口令。口令只在你的服务器 config.json 里，不会下发到 App。</p>
  <input id="tokenInput" type="password" autocomplete="current-password" placeholder="管理口令">
  <div class="row">
    <button class="primary" id="btnLogin">进入</button>
  </div>
  <p id="loginMsg" class="msg err"></p>
</div>

<div id="app" class="hidden">
  <header>
    <h1>ProChat 留言管理</h1>
    <span class="sub" id="counts"></span>
    <span class="grow"></span>
    <a id="boardLink" href="#" target="_blank" rel="noopener">公开留言板 ↗</a>
  </header>
  <main>
    <div class="toolbar">
      <select id="filter">
        <option value="all">全部</option>
        <option value="open">待处理</option>
        <option value="resolved">已解决</option>
        <option value="hidden">已隐藏</option>
      </select>
      <button id="btnRefresh">刷新</button>
      <span class="grow"></span>
      <span id="msg" class="msg"></span>
    </div>

    <div id="list"></div>

    <section class="card">
      <h2>发布更新</h2>
      <p class="meta">把新 APK 放到服务器 <code>public/</code> 目录后，在这里写版本号和下载地址。</p>
      <div class="update-grid">
        <label class="field"><span>versionCode</span><input id="uCode" type="number" min="1" placeholder="9"></label>
        <label class="field"><span>版本名</span><input id="uName" type="text" placeholder="1.2.5"></label>
        <label class="field" style="grid-column:1/-1"><span>下载地址（完整 https 地址）</span><input id="uUrl" type="url" placeholder="https://.../ProChat-1.2.5.apk"></label>
        <label class="field" style="grid-column:1/-1"><span>更新说明</span><textarea id="uNotes" placeholder="新增：...&#10;修复：..."></textarea></label>
      </div>
      <div class="row">
        <label style="display:flex;gap:7px;align-items:center;color:var(--dim);font-size:12.5px">
          <input id="uForce" type="checkbox" style="width:auto"> 强制更新
        </label>
        <button class="primary" id="btnSaveUpdate">保存更新清单</button>
        <span id="updateMsg" class="msg"></span>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';
  const here = location.pathname.replace(/\/+$/, '');
  const BASE = here.endsWith('/admin') ? here.slice(0, -6) : here;
  let TOKEN = new URLSearchParams(location.search).get('token') || sessionStorage.getItem('pcAdminToken') || '';
  const $ = (s) => document.querySelector(s);

  function withToken(url) {
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
  }

  async function api(path, opts) {
    const r = await fetch(withToken(BASE + path), Object.assign({
      headers: { 'Content-Type': 'application/json' }
    }, opts || {}));
    let data = null;
    try { data = await r.json(); } catch (e) {}
    if (r.status === 401) {
      const err = new Error('管理口令不正确');
      err.unauthorized = true;
      throw err;
    }
    if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
    return data;
  }

  function fmt(ts) {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
      p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function setMsg(id, text, kind) {
    const n = document.getElementById(id);
    n.textContent = text || '';
    n.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function showLogin(show) {
    $('#login').classList.toggle('hidden', !show);
    $('#app').classList.toggle('hidden', show);
    if (show) setTimeout(() => $('#tokenInput').focus(), 50);
  }

  function statusText(s) {
    if (s === 'resolved') return '已解决';
    if (s === 'hidden') return '已隐藏';
    return '待处理';
  }

  function cardFor(it) {
    const card = el('div', 'item' + (it.status === 'hidden' ? ' hidden-item' : ''));
    const head = el('div', 'item-head');
    head.appendChild(el('b', null, it.name || '匿名用户'));
    const badge = el('span', 'badge ' + it.status, statusText(it.status));
    head.appendChild(badge);
    head.appendChild(el('time', null, fmt(it.createdAt)));
    head.appendChild(el('span', 'meta', '#' + it.id));
    card.appendChild(head);

    const meta = el('div', 'meta');
    if (it.app && (it.app.version || it.app.model)) {
      meta.appendChild(el('span', null, 'App ' + (it.app.version || '?') +
        (it.app.versionCode ? ' (' + it.app.versionCode + ')' : '') +
        (it.app.sdk ? ' · SDK ' + it.app.sdk : '') +
        (it.app.model ? ' · ' + it.app.model : '')));
    }
    if (it.contact) meta.appendChild(el('span', null, '联系方式：' + it.contact));
    if (it.ipHash) meta.appendChild(el('code', null, 'IP#' + it.ipHash));
    card.appendChild(meta);

    card.appendChild(el('div', 'content', it.content));

    const box = el('div', 'replybox');
    const ta = el('textarea');
    ta.placeholder = '给这条留言写回复（会公开显示）';
    ta.value = it.reply || '';
    box.appendChild(ta);
    card.appendChild(box);

    const actions = el('div', 'actions');
    const btnSave = el('button', 'primary', '保存回复');
    btnSave.onclick = () => patch(it.id, { reply: ta.value }, btnSave);
    actions.appendChild(btnSave);

    if (it.status !== 'resolved') {
      const b = el('button', null, '标记已解决');
      b.onclick = () => patch(it.id, { status: 'resolved', reply: ta.value }, b);
      actions.appendChild(b);
    } else {
      const b = el('button', null, '重新打开');
      b.onclick = () => patch(it.id, { status: 'open' }, b);
      actions.appendChild(b);
    }

    if (it.status !== 'hidden') {
      const b = el('button', null, '隐藏');
      b.onclick = () => patch(it.id, { status: 'hidden' }, b);
      actions.appendChild(b);
    } else {
      const b = el('button', null, '恢复显示');
      b.onclick = () => patch(it.id, { status: 'open' }, b);
      actions.appendChild(b);
    }

    const del = el('button', 'danger', '删除');
    del.onclick = () => {
      if (!confirm('确定永久删除这条留言？')) return;
      del.disabled = true;
      api('/admin/api/feedback/' + encodeURIComponent(it.id), { method: 'DELETE' })
        .then(() => { setMsg('msg', '已删除', 'ok'); loadList(); })
        .catch(err => { del.disabled = false; setMsg('msg', err.message, 'err'); });
    };
    actions.appendChild(del);
    card.appendChild(actions);
    return card;
  }

  function patch(id, body, btn) {
    if (btn) btn.disabled = true;
    setMsg('msg', '保存中…');
    api('/admin/api/feedback/' + encodeURIComponent(id), {
      method: 'POST',
      body: JSON.stringify(body)
    }).then(() => {
      setMsg('msg', '已保存', 'ok');
      loadList();
    }).catch(err => {
      if (btn) btn.disabled = false;
      setMsg('msg', err.message, 'err');
    });
  }

  async function loadList() {
    setMsg('msg', '加载中…');
    try {
      const data = await api('/admin/api/list?status=' + encodeURIComponent($('#filter').value));
      const list = $('#list');
      list.replaceChildren();
      if (!data.items.length) {
        list.appendChild(el('div', 'empty', '这里还没有留言。'));
      } else {
        data.items.forEach(it => list.appendChild(cardFor(it)));
      }
      const c = data.counts || {};
      $('#counts').textContent = '待处理 ' + (c.open || 0) + ' · 已解决 ' + (c.resolved || 0) + ' · 已隐藏 ' + (c.hidden || 0);
      setMsg('msg', '共 ' + data.total + ' 条', 'ok');
    } catch (err) {
      if (err.unauthorized) {
        showLogin(true);
        $('#loginMsg').textContent = '口令不正确，请重新输入。';
      } else {
        setMsg('msg', err.message, 'err');
      }
    }
  }

  async function loadUpdate() {
    try {
      const data = await api('/admin/api/update');
      const u = data.update || {};
      $('#uCode').value = u.versionCode || '';
      $('#uName').value = u.versionName || '';
      $('#uUrl').value = u.url || '';
      $('#uNotes').value = u.notes || '';
      $('#uForce').checked = !!u.force;
    } catch (err) {
      setMsg('updateMsg', err.message, 'err');
    }
  }

  function boot() {
    $('#boardLink').href = BASE + '/board';
    if (!TOKEN) {
      showLogin(true);
      return;
    }
    sessionStorage.setItem('pcAdminToken', TOKEN);
    showLogin(false);
    loadList();
    loadUpdate();
  }

  $('#btnLogin').onclick = () => {
    const t = $('#tokenInput').value.trim();
    if (!t) return;
    TOKEN = t;
    sessionStorage.setItem('pcAdminToken', TOKEN);
    const u = new URL(location.href);
    u.searchParams.set('token', TOKEN);
    history.replaceState(null, '', u.toString());
    $('#loginMsg').textContent = '';
    showLogin(false);
    loadList();
    loadUpdate();
  };
  $('#tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnLogin').click(); });

  $('#btnRefresh').onclick = loadList;
  $('#filter').onchange = loadList;

  $('#btnSaveUpdate').onclick = () => {
    const body = {
      versionCode: Number($('#uCode').value),
      versionName: $('#uName').value.trim(),
      url: $('#uUrl').value.trim(),
      notes: $('#uNotes').value,
      force: $('#uForce').checked
    };
    const btn = $('#btnSaveUpdate');
    btn.disabled = true;
    setMsg('updateMsg', '保存中…');
    api('/admin/api/update', { method: 'POST', body: JSON.stringify(body) })
      .then(data => {
        btn.disabled = false;
        setMsg('updateMsg', '已发布 ' + data.update.versionName + '（' + data.update.versionCode + '）', 'ok');
      })
      .catch(err => {
        btn.disabled = false;
        setMsg('updateMsg', err.message, 'err');
      });
  };

  boot();
})();
</script>
</body>
</html>
